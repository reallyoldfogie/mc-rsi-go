<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rsi-train agents</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #15171c;
    color: #e4e6eb;
    display: flex;
    height: 100vh;
  }
  #sidebar {
    width: 260px;
    flex: none;
    overflow-y: auto;
    border-right: 1px solid #2a2d35;
    background: #1b1e25;
  }
  #sidebar h1 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #8a8f99;
    padding: 12px 14px 8px;
    margin: 0;
  }
  .agent-row {
    padding: 8px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 3px solid transparent;
  }
  .agent-row:hover { background: #22252d; }
  .agent-row.selected { background: #262a33; border-left-color: #5b9dff; }
  .agent-row.all-row { font-weight: 600; border-bottom: 1px solid #2a2d35; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ok { background: #3ddc84; }
  .dot.fail { background: #ff5c5c; }
  .dot.live { background: #5b9dff; }
  .dot.stale { background: #5a5f6b; }
  .agent-row .name { font-weight: 600; }
  .agent-row .task { color: #8a8f99; font-size: 12px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stats {
    position: relative;
    padding: 14px 18px;
    border-bottom: 1px solid #2a2d35;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px 20px;
  }
  #stats .stat label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #8a8f99;
  }
  #stats .stat .val { font-size: 16px; font-weight: 600; }
  /* Positioned absolutely rather than as another grid child, so it
     doesn't get stretched/reflowed by #stats' own auto-fit columns as
     the stat grid's content width changes. */
  .mode-toggle {
    position: absolute;
    top: 12px;
    right: 18px;
    background: #22252d;
    color: #c7cad1;
    border: 1px solid #2a2d35;
    border-radius: 4px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .mode-toggle:hover { background: #2a2d35; }
  #empty { padding: 18px; color: #8a8f99; }
  #inventory {
    padding: 0 18px 12px;
    border-bottom: 1px solid #2a2d35;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .inventory-divider { flex: none; width: 1px; height: 34px; background: #2a2d35; margin: 0 2px; }
  .item-chip {
    position: relative;
    flex: none;
    width: 34px;
    height: 34px;
    background: #1b1e25;
    border: 1px solid #2a2d35;
    border-radius: 3px;
  }
  .item-chip img, .item-chip .badge {
    position: absolute;
    inset: 2px;
    width: calc(100% - 4px);
    height: calc(100% - 4px);
    image-rendering: pixelated;
  }
  .item-chip .badge {
    display: none;
    align-items: center;
    justify-content: center;
    background: #2a2d35;
    border-radius: 2px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .item-chip .count {
    position: absolute;
    right: 2px;
    bottom: 1px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000;
  }
  /* #plot-wrap (an ordinary block element) absorbs the flex sizing;
     #plot itself just fills it via plain percentages. A canvas given
     flex:1 directly, with no explicit width/height CSS, can get sized
     off its own width/height attributes' aspect ratio instead of
     stretching to fill the flex container - this sidesteps that. */
  #plot-wrap { flex: 1; min-height: 0; position: relative; }
  #plot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #camera-view { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #000; }
</style>
</head>
<body>
<div id="sidebar">
  <h1>Agents</h1>
  <div id="rows"></div>
</div>
<div id="main">
  <div id="stats"></div>
  <div id="inventory"></div>
  <div id="plot-wrap">
    <canvas id="plot"></canvas>
    <iframe id="camera-view"></iframe>
  </div>
</div>
<script>
(function () {
  "use strict";

  var selected = null;
  var latest = [];

  // viewMode is "2d" (the default - the plot canvas) or "3d" (the
  // camera-view iframe, proxied through this same dashboard server from
  // a camera-viewer container rsi-train manages - see
  // cmd/rsi-train/cameraviewer.go and camera-viewer/README.md). Only
  // meaningful while an agent is selected; see render's own check below
  // for what happens if the selection is lost while in 3D mode.
  var viewMode = "2d";

  // trails holds each agent's last TRAIL_LENGTH positions (index -> [{x,
  // z}, ...], oldest first), purely client-side - the backend only ever
  // gives us the current snapshot, so this is the dashboard's own memory
  // of "where has this bot been," not something /agents reports.
  var trails = {};
  var TRAIL_LENGTH = 20;

  // updateTrails appends latest's current positions to each agent's trail
  // and drops any agent no longer present (e.g. a parallel-envs scale-down)
  // so trails never grows unbounded. Called once per poll, before render.
  function updateTrails() {
    var liveIndices = {};
    latest.forEach(function (a) {
      liveIndices[a.index] = true;
      var h = trails[a.index] || (trails[a.index] = []);
      h.push({ x: a.x, z: a.z });
      if (h.length > TRAIL_LENGTH) h.shift();
    });
    Object.keys(trails).forEach(function (k) {
      if (!liveIndices[k]) delete trails[k];
    });
  }

  function statusDot(a) {
    var ageMs = Date.now() - new Date(a.updated_at).getTime();
    if (ageMs > 5000) return "stale";
    if (a.last_outcome === "success") return "ok";
    if (a.last_outcome === "failure") return "fail";
    return "live";
  }

  function renderSidebar() {
    var rows = document.getElementById("rows");
    rows.innerHTML = "";

    var allRow = document.createElement("div");
    allRow.className = "agent-row all-row" + (selected === null ? " selected" : "");
    allRow.onclick = function () { selectAgent(null); };
    allRow.textContent = "All agents";
    rows.appendChild(allRow);

    latest.forEach(function (a) {
      var row = document.createElement("div");
      row.className = "agent-row" + (a.index === selected ? " selected" : "");
      row.onclick = function () { selectAgent(a.index); };
      var dot = document.createElement("div");
      dot.className = "dot " + statusDot(a);
      var text = document.createElement("div");
      text.innerHTML = "<div class='name'>" + (a.username || ("agent-" + a.index)) + "</div>" +
        "<div class='task'>" + (a.task || "-") + "</div>";
      row.appendChild(dot);
      row.appendChild(text);
      rows.appendChild(row);
    });
  }

  function stat(label, value) {
    return "<div class='stat'><label>" + label + "</label><div class='val'>" + value + "</div></div>";
  }

  // resolveSelected returns the currently selected agent's latest
  // snapshot, or null if nothing is selected or the selected agent is no
  // longer connected - the single source of truth renderStats,
  // renderInventory, and renderPlot's zoomed branch all key off.
  function resolveSelected() {
    if (selected === null) return null;
    var a = latest.find(function (x) { return x.index === selected; });
    return a || null;
  }

  function renderStats(a) {
    var el = document.getElementById("stats");
    if (selected === null) {
      el.innerHTML = "<div id='empty'>Viewing all agents - select one to zoom in.</div>";
      return;
    }
    if (!a) {
      el.innerHTML = "<div id='empty'>Agent " + selected + " is no longer connected.</div>";
      return;
    }
    el.innerHTML =
      stat("Agent", a.username || ("agent-" + a.index)) +
      stat("Task", a.task || "-") +
      stat("Goal", a.goal || "-") +
      stat("Last action", a.last_action || "-") +
      stat("Episode step", a.episode_step) +
      stat("Last outcome", a.last_outcome || "in progress") +
      stat("Position", a.x.toFixed(1) + ", " + a.y.toFixed(1) + ", " + a.z.toFixed(1)) +
      stat("Yaw / pitch", a.yaw.toFixed(0) + "° / " + a.pitch.toFixed(0) + "°") +
      stat("Health", a.health.toFixed(1) + " / 20") +
      stat("Food", a.food + " / 20") +
      stat("Updated", new Date(a.updated_at).toLocaleTimeString());

    // Appended as a real DOM node after the innerHTML assignment above
    // (which would otherwise wipe it) rather than folded into that
    // string - it needs a live onclick handler, unlike the plain stat()
    // cells.
    var toggle = document.createElement("button");
    toggle.className = "mode-toggle";
    toggle.textContent = viewMode === "2d" ? "Switch to 3D" : "Switch to 2D";
    toggle.onclick = toggleViewMode;
    el.appendChild(toggle);
  }

  // selectAgent is renderSidebar's one entry point for changing which
  // agent is selected (replacing a bare `selected = ...` assignment) -
  // it also keeps the 3D camera (if active) pointed at whatever's
  // selected: re-following the new target in place if one is still
  // selected, or dropping back to 2D if the selection was cleared
  // (index === null) - 3D mode has no meaning for "all agents."
  function selectAgent(index) {
    selected = index;
    if (viewMode === "3d") {
      var a = resolveSelected();
      if (a) {
        enterCameraMode(a);
      } else {
        viewMode = "2d";
        exitCameraMode();
      }
    }
    render();
  }

  // enterCameraMode points the camera-viewer container (rsi-train-
  // managed - see cmd/rsi-train/cameraviewer.go) at agent a, lazily
  // starting it on the very first call. Safe to call again for a
  // container that's already running (selectAgent's re-follow path) -
  // that's just a cheap retarget, not a restart.
  function enterCameraMode(a) {
    var bot = a.username || ("agent-" + a.index);
    fetch("/camera/follow?bot=" + encodeURIComponent(bot), { method: "POST" })
      .then(function (r) {
        if (!r.ok) throw new Error("follow failed: " + r.status);
        var frame = document.getElementById("camera-view");
        // Only (re)loaded on the first entry into 3D mode for this
        // session - once it's open, re-following a different bot
        // (selectAgent above) just changes what the already-connected
        // viewer is spectating server-side; reloading the iframe would
        // needlessly drop and reopen its WebSocket.
        if (!frame.getAttribute("src")) frame.setAttribute("src", "/camera/view/");
        document.getElementById("plot").style.display = "none";
        frame.style.display = "block";
      })
      .catch(function (err) {
        console.error("camera-viewer:", err);
        viewMode = "2d";
        exitCameraMode();
        render();
      });
  }

  // exitCameraMode tears down the camera-viewer container (POST
  // /camera/stop - best effort, this never blocks switching the UI back
  // to 2D) and hides the iframe, clearing its src so the next
  // enterCameraMode gets a fresh connection against whatever container
  // that next call starts.
  function exitCameraMode() {
    var frame = document.getElementById("camera-view");
    frame.style.display = "none";
    frame.removeAttribute("src");
    document.getElementById("plot").style.display = "block";
    fetch("/camera/stop", { method: "POST" }).catch(function () { /* best effort */ });
  }

  function toggleViewMode() {
    var a = resolveSelected();
    if (!a) return; // the toggle button only ever renders when one is selected and connected
    if (viewMode === "2d") {
      viewMode = "3d";
      enterCameraMode(a);
    } else {
      viewMode = "2d";
      exitCameraMode();
    }
    renderStats(a);
  }

  // Covers the "closed the tab/navigated away while in 3D mode" case
  // selectAgent/toggleViewMode's own exitCameraMode calls can't - a
  // regular fetch would be aborted mid-flight by the navigation it's
  // racing; sendBeacon is designed to actually complete in that case.
  window.addEventListener("beforeunload", function () {
    if (viewMode === "3d") {
      navigator.sendBeacon("/camera/stop");
    }
  });

  // INVENTORY_MAIN_SLOTS is how many of agentSnapshot.inventory's leading
  // entries are main-inventory slots (the rest are hotbar) - matches
  // screen.MainSlotEnd-MainSlotStart (dashboard.go's readInventory passes
  // Main() before Hotbar()), used only to draw a divider between the two
  // groups, same as the real inventory screen's own gap.
  var INVENTORY_MAIN_SLOTS = 27;

  function renderInventory(a) {
    var el = document.getElementById("inventory");
    el.innerHTML = "";
    var items = a && a.inventory || [];
    el.style.display = a ? "flex" : "none";
    items.forEach(function (it, i) {
      if (i === INVENTORY_MAIN_SLOTS) {
        var divider = document.createElement("div");
        divider.className = "inventory-divider";
        el.appendChild(divider);
      }

      var chip = document.createElement("div");
      chip.className = "item-chip";

      if (!it.name) {
        chip.title = "slot " + it.slot + " (empty)";
        el.appendChild(chip); // empty slot: just the box, nothing in it.
        return;
      }
      chip.title = it.name + " ×" + it.count + " (slot " + it.slot + ")";

      var img = document.createElement("img");
      img.src = "/icons/" + encodeURIComponent(it.name) + ".png";
      img.alt = it.name;
      var badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = it.name.charAt(0).toUpperCase();
      img.onerror = function () {
        img.style.display = "none";
        badge.style.display = "flex";
      };

      var count = document.createElement("span");
      count.className = "count";
      count.textContent = "×" + it.count;

      chip.appendChild(img);
      chip.appendChild(badge);
      chip.appendChild(count);
      el.appendChild(chip);
    });
  }

  // MIN_ZOOM_RADIUS is the smallest half-window (in blocks) the per-agent
  // zoomed view will ever use, even when the bot, its spawn, and its
  // target are all clustered tightly together - comfortably larger than
  // -clear-area-radius's own default (16) so the bot's immediate working
  // area stays in view. The actual radius grows beyond this to fit the
  // bot/spawn/target bounding box - see zoomRadiusFor.
  var MIN_ZOOM_RADIUS = 24;

  // ZOOM_PADDING_FRACTION leaves a little breathing room around the
  // bot/spawn/target bounding box, so a marker right at the edge of a
  // tight box isn't drawn flush against the canvas border.
  var ZOOM_PADDING_FRACTION = 0.2;

  // zoomRadiusFor returns the half-window (in world blocks) that fits
  // sel's own position plus its Spawn/Target markers (when known), never
  // smaller than MIN_ZOOM_RADIUS - a goto/mine_far/craft_far/chain episode
  // can send a bot (and its target) well outside a fixed 24-block window,
  // and without this the dynamic zoom the user asked for would just be a
  // bigger fixed radius instead.
  function zoomRadiusFor(sel) {
    var radius = MIN_ZOOM_RADIUS;
    [sel.spawn, sel.target].forEach(function (p) {
      if (!p) return;
      radius = Math.max(radius, Math.abs(p.x - sel.x), Math.abs(p.z - sel.z));
    });
    return radius * (1 + ZOOM_PADDING_FRACTION);
  }

  // niceGridStep picks a "round" world-unit spacing (1/2/5 x a power of
  // ten) that puts roughly targetLines gridlines across span world units -
  // the same rounding Google Maps/D3 axis ticks use, so the grid reads as
  // "20 blocks apart," never an arbitrary value like 17.3.
  function niceGridStep(span, targetLines) {
    var raw = span / targetLines;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var residual = raw / mag;
    var nice = residual > 5 ? 10 : residual > 2 ? 5 : residual > 1 ? 2 : 1;
    return nice * mag;
  }

  // drawGrid gives the plot a sense of scale and orientation - without it
  // there's nothing on screen to judge "how far" or "which way" from,
  // just a dot floating in a void. Gridlines are drawn at absolute world
  // coordinates (not relative to the view), so they line up the same way
  // regardless of which agent is selected.
  function drawGrid(ctx, w, h, centerX, centerZ, scale) {
    var step = niceGridStep(Math.min(w, h) / scale, 5);
    var worldLeft = centerX - (w / 2) / scale, worldRight = centerX + (w / 2) / scale;
    var worldTop = centerZ - (h / 2) / scale, worldBottom = centerZ + (h / 2) / scale;

    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    ctx.font = "10px sans-serif";
    ctx.lineWidth = 1;

    for (var gx = Math.ceil(worldLeft / step) * step; gx <= worldRight; gx += step) {
      var px = w / 2 + (gx - centerX) * scale;
      ctx.beginPath();
      ctx.moveTo(px, 0);
      ctx.lineTo(px, h);
      ctx.stroke();
      ctx.fillText(gx.toFixed(0), px + 3, 11);
    }
    for (var gz = Math.ceil(worldTop / step) * step; gz <= worldBottom; gz += step) {
      var py = h / 2 + (gz - centerZ) * scale;
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(w, py);
      ctx.stroke();
      ctx.fillText(gz.toFixed(0), 3, py - 3);
    }
  }

  // drawFacingIndicator draws a short arrow from (x, y) in the direction
  // yawDeg faces, turning a plain dot into something that shows which way
  // the bot is actually looking. dx/dz mirrors Minecraft's own yaw
  // convention (0 = +Z/south, 90 = -X/west), the same formula bot
  // libraries use to turn yaw into a direction vector.
  function drawFacingIndicator(ctx, x, y, yawDeg, len, color) {
    var rad = yawDeg * Math.PI / 180;
    var dx = -Math.sin(rad), dz = Math.cos(rad);
    var tipX = x + dx * len, tipY = y + dz * len;

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(tipX, tipY);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();

    var angle = Math.atan2(dz, dx), headLen = 5;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - headLen * Math.cos(angle - Math.PI / 6), tipY - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(tipX - headLen * Math.cos(angle + Math.PI / 6), tipY - headLen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  // drawHomeIcon draws a small house outline at (x, y), marking the
  // selected bot's episode spawn point - a fixed landmark to judge
  // distance/drift against as the bot moves around the zoomed view.
  function drawHomeIcon(ctx, x, y, color) {
    var halfW = 7, roofH = 6, wallH = 7;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - halfW, y + wallH / 2);
    ctx.lineTo(x - halfW, y - wallH / 2);
    ctx.lineTo(x, y - wallH / 2 - roofH);
    ctx.lineTo(x + halfW, y - wallH / 2);
    ctx.lineTo(x + halfW, y + wallH / 2);
    ctx.closePath();
    ctx.stroke();
  }

  // drawTargetMarker draws a crosshair at (x, y), marking this episode's
  // fixed destination (see agentSnapshot.Target's own doc comment) - a
  // goto/mine_far/craft_far/chain episode's bot is working toward this
  // exact point, distinct from drifting toward "wherever a block/table
  // happens to be," which a plain mine/craft episode has no marker for at
  // all.
  function drawTargetMarker(ctx, x, y, color) {
    var r = 7;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - r - 4, y);
    ctx.lineTo(x - r + 2, y);
    ctx.moveTo(x + r - 2, y);
    ctx.lineTo(x + r + 4, y);
    ctx.moveTo(x, y - r - 4);
    ctx.lineTo(x, y - r + 2);
    ctx.moveTo(x, y + r - 2);
    ctx.lineTo(x, y + r + 4);
    ctx.stroke();
  }

  function renderPlot() {
    var canvas = document.getElementById("plot");
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (latest.length === 0) return;

    var pad = 30;
    var sel = resolveSelected();
    var centerX, centerZ, scale, visible;

    if (sel) {
      // Single-agent zoomed view - the view a future 3D camera feed
      // would replace/sit alongside. The radius grows to keep Spawn/
      // Target in frame (see zoomRadiusFor) instead of a fixed window,
      // so a far-off goto/chain target is never clipped out of view.
      var zoomRadius = zoomRadiusFor(sel);
      centerX = sel.x;
      centerZ = sel.z;
      scale = Math.min(w - 2 * pad, h - 2 * pad) / (2 * zoomRadius);
      visible = latest.filter(function (a) {
        return Math.abs(a.x - centerX) <= zoomRadius && Math.abs(a.z - centerZ) <= zoomRadius;
      });
    } else {
      var minX = Math.min.apply(null, latest.map(function (a) { return a.x; }));
      var maxX = Math.max.apply(null, latest.map(function (a) { return a.x; }));
      var minZ = Math.min.apply(null, latest.map(function (a) { return a.z; }));
      var maxZ = Math.max.apply(null, latest.map(function (a) { return a.z; }));
      var spanX = Math.max(maxX - minX, 1);
      var spanZ = Math.max(maxZ - minZ, 1);
      centerX = (minX + maxX) / 2;
      centerZ = (minZ + maxZ) / 2;
      scale = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanZ);
      visible = latest;
    }

    function toCanvas(a) {
      return [w / 2 + (a.x - centerX) * scale, h / 2 + (a.z - centerZ) * scale];
    }

    drawGrid(ctx, w, h, centerX, centerZ, scale);

    // Nearby entities (dropped items, mobs, ...) only make sense once
    // zoomed to a single bot - at the all-agents scale they'd be
    // indistinguishable from the bot's own dot. Drawn before the agents
    // themselves so a bot's own dot/trail/label always reads on top.
    if (sel && sel.nearby) {
      sel.nearby.forEach(function (e) {
        var p = toCanvas(e);
        ctx.beginPath();
        ctx.arc(p[0], p[1], 3, 0, Math.PI * 2);
        ctx.fillStyle = "#d9a24b";
        ctx.fill();
        ctx.fillStyle = "rgba(217,162,75,0.8)";
        ctx.font = "10px sans-serif";
        ctx.fillText(e.type, p[0] + 6, p[1] + 3);
      });
    }

    // Spawn/Target markers only make sense once zoomed to a single bot -
    // same reasoning as nearby entities above. Drawn before the agent
    // dots so a bot's own dot/trail/label always reads on top even when
    // it's sitting right on top of one of these.
    if (sel && sel.spawn) {
      var spawnP = toCanvas(sel.spawn);
      drawHomeIcon(ctx, spawnP[0], spawnP[1], "#8a8f99");
      ctx.fillStyle = "rgba(138,143,153,0.8)";
      ctx.font = "10px sans-serif";
      ctx.fillText("spawn", spawnP[0] + 10, spawnP[1] + 3);
    }
    if (sel && sel.target) {
      var targetP = toCanvas(sel.target);
      drawTargetMarker(ctx, targetP[0], targetP[1], "#d9534f");
      ctx.fillStyle = "rgba(217,83,79,0.85)";
      ctx.font = "10px sans-serif";
      ctx.fillText("target", targetP[0] + 10, targetP[1] + 3);
    }

    visible.forEach(function (a) {
      var p = toCanvas(a);
      var isSel = a.index === selected;
      var color = isSel ? "#5b9dff" : "#8a8f99";

      var trail = trails[a.index];
      if (trail && trail.length > 1) {
        ctx.beginPath();
        trail.forEach(function (pos, i) {
          var tp = toCanvas(pos);
          if (i === 0) ctx.moveTo(tp[0], tp[1]); else ctx.lineTo(tp[0], tp[1]);
        });
        ctx.strokeStyle = isSel ? "rgba(91,157,255,0.5)" : "rgba(138,143,153,0.35)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(p[0], p[1], isSel ? 8 : 5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      if (isSel) {
        ctx.beginPath();
        ctx.arc(p[0], p[1], 13, 0, Math.PI * 2);
        ctx.strokeStyle = "#5b9dff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      drawFacingIndicator(ctx, p[0], p[1], a.yaw, isSel ? 16 : 11, color);

      ctx.fillStyle = "#c7cad1";
      ctx.font = "11px sans-serif";
      ctx.fillText(a.username || ("agent-" + a.index), p[0] + 10, p[1] - 10);
    });
  }

  function render() {
    var a = resolveSelected();
    // 3D mode has no meaning once there's no valid selected agent to
    // follow (deselected back to "all agents," or the selected one
    // disconnected/scaled down) - drop back to 2D rather than leaving
    // the iframe showing a frozen last frame of a bot that's gone.
    if (viewMode === "3d" && !a) {
      viewMode = "2d";
      exitCameraMode();
    }
    renderSidebar();
    renderStats(a);
    renderInventory(a);
    renderPlot();
  }

  function poll() {
    fetch("/agents").then(function (r) { return r.json(); }).then(function (data) {
      latest = data || [];
      updateTrails();
      render();
    }).catch(function () { /* transient fetch error; try again next tick */ });
  }

  window.addEventListener("resize", renderPlot);
  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
